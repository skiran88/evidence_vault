
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EvidenceVault | Upload Evidence</title>

<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">

<link href="/static/assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
<link href="/static/assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">

<style>

body{
font-family:"Open Sans",sans-serif;
background:#f4f7fc;
}

/* Navbar */

.dashboard-nav{
background:#37517e;
padding:15px 0;
box-shadow:0 4px 20px rgba(0,0,0,0.1);
}

.navbar-brand{
font-family:"Jost";
font-size:22px;
font-weight:700;
color:white;
}

.logout-btn{
background:#ff4d4d;
color:white;
padding:6px 14px;
border-radius:6px;
text-decoration:none;
}

/* Page title */

.page-title{
margin-top:30px;
font-weight:700;
font-family:"Jost";
}

/* Form Card */

.form-card{
background:white;
padding:35px;
border-radius:14px;
box-shadow:0 6px 25px rgba(0,0,0,0.08);
margin-top:25px;
}

.form-label{
font-weight:600;
}

.submit-btn{
background:#37517e;
border:none;
padding:10px 20px;
}

.submit-btn:hover{
background:#2c426a;
}

</style>

</head>

<body>

<!-- Navbar -->

<nav class="navbar dashboard-nav">

<div class="container-fluid px-4">

<a class="navbar-brand">
EvidenceVault
</a>

<a href="{% url 'home' %}" class="logout-btn">Logout</a>

</div>

</nav>


<div class="container">

<h3 class="page-title">Upload Case Evidence to Blockchain</h3>

<p>Submit digital evidence securely. The system will generate a blockchain hash to ensure tamper-proof storage.</p>


<div class="form-card">

<form method="POST" enctype="multipart/form-data">

{% csrf_token %}

<div class="row">

<!--<div class="col-md-6 mb-3">-->
<!--<label class="form-label">Case ID</label>-->
<!--<input type="text" class="form-control" name="case_id" required>-->
<!--</div>-->

<div class="col-md-6 mb-3">
<label class="form-label">Case Title</label>
<input type="text" class="form-control" name="case_title" required>
</div>

</div>


<div class="row">

<div class="col-md-6 mb-3">
<label class="form-label">Evidence Type</label>
<select class="form-control" name="evidence_type">

<option>Image</option>
<option>Video</option>
<option>Audio</option>
<option>Document</option>
<option>Mobile Data</option>

</select>
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Upload Evidence File</label>
<input type="file" name="evidence_files" multiple>
</div>

</div>


<div class="mb-3">

<label class="form-label">Evidence Description</label>

<textarea class="form-control" rows="4" name="description"></textarea>

</div>


<div class="mb-3">

<label class="form-label">Generated Blockchain Hash</label>

<input type="text" class="form-control" placeholder="Auto-generated after submission" readonly>

</div>


<button class="btn btn-primary submit-btn">
Submit Evidence to Blockchain
</button>

</form>

</div>

</div>

<script src="/static/assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>

</body>
</html>
