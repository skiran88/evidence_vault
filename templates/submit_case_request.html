

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EvidenceVault | Submit Case Request</title>

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Bootstrap -->
<link href="/static/assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
<link href="/static/assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">

<style>

body{
font-family:"Open Sans",sans-serif;
background:#f4f7fc;
}

/* Navbar */

.dashboard-nav{
background:#37517e;
padding:15px 0;
box-shadow:0 4px 20px rgba(0,0,0,0.1);
}

.navbar-brand{
font-family:"Jost";
font-size:22px;
font-weight:700;
color:white;
}

.logout-btn{
background:#ff4d4d;
color:white;
padding:6px 14px;
border-radius:6px;
text-decoration:none;
}

/* Page Title */

.page-title{
margin-top:30px;
font-family:"Jost";
font-weight:700;
}

/* Form Card */

.form-card{
background:white;
padding:35px;
border-radius:14px;
box-shadow:0 6px 25px rgba(0,0,0,0.08);
margin-top:25px;
}

.form-label{
font-weight:600;
}

.submit-btn{
background:#37517e;
border:none;
padding:10px 20px;
}

.submit-btn:hover{
background:#2c426a;
}

</style>

</head>

<body>

<!-- Navbar -->

<nav class="navbar dashboard-nav">

<div class="container-fluid px-4">

<a class="navbar-brand">
EvidenceVault
</a>

<a href="{% url 'home' %}" class="logout-btn">Logout</a>

</div>

</nav>


<div class="container">

<h3 class="page-title">Submit Legal Case Request</h3>

<p>
Describe your legal issue and send a request to advocates for assistance.
</p>


<div class="form-card">

<form method="POST" enctype="multipart/form-data">

{% csrf_token %}

<input type="hidden" name="category" value="{{ request.GET.cat_id }}">
<input type="hidden" name="advocate_id" value="{{ request.GET.adv_id }}">

<div class="row">

<div class="col-md-6 mb-3">
<label class="form-label">Case Title</label>
<input type="text" name="case_title" class="form-control" required>
</div>


                    <!--<div class="col-md-6 mb-3">-->
                      <!--<label class="form-label">Category</label>-->
                      <!--<select name="category_name" class="form-control" required>-->
                      <!--<option value="">Select Category</option>-->

                      <!--{% for category in categories %}-->
                        <!--<option value="{{ category.id }}">-->
                          <!--{{ category.category_name }}-->
                        <!--</option>-->
                      <!--{% endfor %}-->

                      <!--</select>-->





<div class="mb-3">

<label class="form-label">Case Description</label>

<textarea name="description" class="form-control" rows="4"
placeholder="Explain your legal problem..."></textarea>

</div>


<div class="row">

<div class="col-md-6 mb-3">

<label class="form-label">Upload Initial Evidence</label>

<input type="file" name="evidence_file" class="form-control">

</div>


</div>


<div class="mb-3">

<label class="form-label">Court Location</label>

<input type="text" name="court_location" class="form-control"
placeholder="Example: Kochi District Court">

</div>


<button class="btn btn-primary submit-btn">
Submit Case Request
</button>

</form>

</div>

</div>


<script src="/static/assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>

</body>
</html>
